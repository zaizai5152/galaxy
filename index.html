<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>关关的银河系</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap');

:root {
    --k-paper: #FDFBF7;      
    --k-ink: #111111;        
    --k-red: #E63946;        
    --k-yellow: #FFD166;     
    --k-blue: #457B9D;       
    --k-green: #06D6A0;      
    --k-white: #FFFFFF;
    
    --k-stroke: 4px solid var(--k-ink);
    --k-shadow: 6px 6px 0px var(--k-ink);
    --k-shadow-hover: 2px 2px 0px var(--k-ink);
}

* { box-sizing: border-box; }

body {
    margin: 0;
    background-color: var(--k-paper);
    color: var(--k-ink);
    font-family: 'Comic Neue', cursive;
    font-weight: 700;
    line-height: 1.6;
    overflow-x: hidden;
}

h1, h2, h3, h4 {
    font-family: 'Bangers', cursive;
    letter-spacing: 2px;
    margin: 0 0 16px 0;
    text-transform: uppercase;
}

.k-halftone {
    background-image: radial-gradient(var(--k-ink) 15%, transparent 16%), radial-gradient(var(--k-ink) 15%, transparent 16%);
    background-size: 14px 14px;
    background-position: 0 0, 7px 7px;
    position: relative;
    z-index: 1;
}
.k-halftone::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: var(--k-paper); opacity: 0.85; z-index: -1;
}

.k-card {
    background-color: var(--k-white);
    border: var(--k-stroke);
    box-shadow: var(--k-shadow);
    padding: 32px;
    border-radius: 2px;
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.k-btn {
    display: inline-block;
    background-color: var(--k-yellow);
    color: var(--k-ink);
    border: var(--k-stroke);
    box-shadow: var(--k-shadow);
    padding: 12px 32px;
    font-family: 'Bangers', cursive;
    font-size: 24px;
    text-decoration: none;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.1s ease;
}
.k-btn:hover { background-color: var(--k-red); color: var(--k-white); }
.k-btn:active { transform: translate(4px, 4px); box-shadow: var(--k-shadow-hover); }
.k-btn.blue { background-color: var(--k-blue); color: var(--k-white); }
.k-btn.blue:hover { background-color: var(--k-ink); }
.k-btn.full { width: 100%; text-align: center; }

.k-speech-bubble {
    position: relative;
    background: var(--k-white);
    border: var(--k-stroke);
    padding: 24px;
    border-radius: 50%;
    text-align: center;
    box-shadow: var(--k-shadow);
    font-size: 18px;
    display: inline-block;
    margin-bottom: 24px;
}
/* FIXED: Changed invalid 'display' to 'transparent' in border-color */
.k-speech-bubble::after {
    content: ''; position: absolute; bottom: -24px; left: 50px;
    border-width: 24px 24px 0; border-style: solid;
    border-color: var(--k-ink) transparent transparent transparent; display: block; width: 0;
}
.k-speech-bubble::before {
    content: ''; position: absolute; bottom: -16px; left: 54px;
    border-width: 18px 18px 0; border-style: solid;
    border-color: var(--k-white) transparent transparent transparent; display: block; width: 0; z-index: 1;
}

.k-input {
    width: 100%;
    padding: 16px;
    background-color: var(--k-white);
    border: var(--k-stroke);
    box-shadow: 4px 4px 0px rgba(17, 17, 17, 0.2);
    font-family: 'Comic Neue', cursive;
    font-size: 18px;
    font-weight: 700;
    outline: none;
    transition: box-shadow 0.2s, background-color 0.2s;
    margin-bottom: 16px;
}
.k-input:focus { box-shadow: var(--k-shadow); background-color: rgba(255, 209, 102, 0.1); }

.k-badge {
    background: var(--k-red); color: var(--k-white); font-family: 'Bangers', cursive;
    padding: 4px 12px; font-size: 18px; border: 2px solid var(--k-ink);
    transform: rotate(-5deg); display: inline-block; box-shadow: 3px 3px 0px var(--k-ink);
}

.container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
header.hero { text-align: center; padding: 80px 20px 100px 20px; border-bottom: var(--k-stroke); background-color: var(--k-yellow); }
.hero h1 { font-size: 80px; margin-bottom: 0; text-shadow: 4px 4px 0px var(--k-white), 8px 8px 0px var(--k-ink); }
.hero p { font-size: 24px; max-width: 600px; margin: 20px auto 40px auto; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
.feature-list { list-style: none; padding: 0; margin: 0; font-size: 18px; }
.feature-list li { margin-bottom: 10px; border-bottom: 2px dashed var(--k-ink); padding-bottom: 5px; }

.pricing-card { text-align: center; background: var(--k-white); }
.pricing-card h2 { font-size: 40px; color: var(--k-blue); }
.pricing-card .price { font-family: 'Bangers', cursive; font-size: 60px; margin: 20px 0; color: var(--k-red); }
.pricing-card ul { list-style: none; padding: 0; margin: 0 0 30px 0; text-align: left; }
.pricing-card li { margin-bottom: 12px; font-size: 18px; border-bottom: 2px dashed var(--k-ink); padding-bottom: 8px; }

/* Tablet Responsiveness */
@media (max-width: 1024px) {
    .grid-3 { grid-template-columns: repeat(2, 1fr); }
}

/* Mobile Responsiveness */
@media (max-width: 800px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .hero h1 { font-size: 60px; text-shadow: 3px 3px 0px var(--k-white), 6px 6px 0px var(--k-ink); }
    
    /* Removes the scale effect on mobile so the Premium card doesn't overlap the others */
    .pricing-card { transform: none !important; margin-bottom: 20px; }
         }

</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&amp;family=Noto+Sans+SC:wght@300;400;500&amp;display=swap" rel="stylesheet"/>
<style>
:root {
  --g-cosmic: #0b1838;
  --g-plum: #4d4177;
  --g-sky: #3a60a0;
  --g-glow: #88a5e0;
  --g-mist: #c8ddf5;
  --g-white: #e8eef8;
}
body.galaxy-page {
  background: #020818;
  color: var(--g-mist);
  min-height: 100vh;
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  font-weight: 300;
  margin: 0;
}
.galaxy-page h1, .galaxy-page h2, .galaxy-page h3, .galaxy-page h4 {
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  letter-spacing: 2px;
  text-transform: none;
}
.galaxy-page .container { max-width: 1200px; }
.galaxy-page .k-card {
  background: rgba(11, 24, 56, 0.85);
  backdrop-filter: blur(12px);
  color: var(--g-mist);
  border: 1px solid rgba(136, 165, 224, 0.25);
  box-shadow: 0 8px 32px rgba(11, 24, 56, 0.6), inset 0 1px 0 rgba(200, 221, 245, 0.08);
  border-radius: 12px;
  padding: 28px;
}
.galaxy-page .k-input {
  background: rgba(136, 165, 224, 0.08);
  color: var(--g-mist);
  border: 1px solid rgba(136, 165, 224, 0.3);
  box-shadow: none;
  border-radius: 8px;
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
}
.galaxy-page .k-input:focus {
  background: rgba(136, 165, 224, 0.14);
  border-color: var(--g-glow);
  box-shadow: 0 0 12px rgba(136, 165, 224, 0.2);
}
.galaxy-page .k-input::placeholder { color: rgba(200, 221, 245, 0.4); }
.galaxy-page a.k-btn { text-decoration: none; }
.galaxy-page .k-btn {
  background: rgba(58, 96, 160, 0.5);
  color: var(--g-mist);
  border: 1px solid rgba(136, 165, 224, 0.35);
  box-shadow: 0 4px 16px rgba(11, 24, 56, 0.4);
  border-radius: 8px;
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  font-size: 14px;
  padding: 10px 22px;
  text-transform: none;
  letter-spacing: 1px;
  transition: all 0.25s ease;
}
.galaxy-page .k-btn:hover {
  background: rgba(77, 65, 119, 0.6);
  color: #fff;
  border-color: rgba(200, 221, 245, 0.5);
  box-shadow: 0 0 20px rgba(136, 165, 224, 0.3);
}
.galaxy-page .k-btn:active { transform: translateY(2px); box-shadow: none; }
.galaxy-page .k-btn.blue {
  background: rgba(77, 65, 119, 0.45);
}
.galaxy-page .k-btn.blue:hover { background: rgba(58, 96, 160, 0.65); }
.galaxy-page .k-btn.full { width: 100%; text-align: center; }
.galaxy-page .k-badge {
  background: rgba(136, 165, 224, 0.2);
  color: var(--g-glow);
  border: 1px solid rgba(136, 165, 224, 0.3);
  box-shadow: none;
  border-radius: 20px;
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
  font-size: 14px;
  transform: none;
  padding: 4px 14px;
}
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px;
  background: rgba(11, 24, 56, 0.5);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(136, 165, 224, 0.1);
  position: relative; z-index: 10;
}
.topbar-left, .topbar-right { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
.topbar-center {
  position: absolute; left: 50%; transform: translateX(-50%);
  text-align: center; pointer-events: none;
}
.topbar-center h1 {
  font-size: 20px; color: rgba(200,221,245,0.9); letter-spacing: 4px;
  font-weight: 300; margin: 0; pointer-events: auto; cursor: default;
  text-shadow: 0 0 20px rgba(136,165,224,0.2);
}
.topbar-subtitle {
  font-size: 12px; color: rgba(200,221,245,0.4); letter-spacing: 2px;
  font-weight: 300; margin: 2px 0 0 0;
}
.loading-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: #060e24;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: opacity 0.8s ease;
}
.loading-overlay.fade-out { opacity: 0; pointer-events: none; }
.loading-star {
  width: 20px; height: 20px; border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, rgba(136,165,224,0.6) 50%, transparent 75%);
  box-shadow: 0 0 20px 6px rgba(136,165,224,0.4), 0 0 60px 12px rgba(136,165,224,0.15);
  animation: loading-pulse 1.5s ease-in-out infinite;
}
.loading-text {
  margin-top: 20px; font-size: 13px; color: rgba(200,221,245,0.4);
  letter-spacing: 3px; font-weight: 300;
}
@keyframes loading-pulse {
  0%, 100% { transform: scale(1); opacity: 0.4; }
  50% { transform: scale(1.6); opacity: 1; }
}
.toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: rgba(11, 24, 56, 0.9); backdrop-filter: blur(12px);
  border: 1px solid rgba(136,165,224,0.3); border-radius: 8px;
  padding: 12px 28px; color: var(--g-mist); font-size: 14px; font-weight: 300;
  letter-spacing: 1px; z-index: 300; opacity: 0;
  transition: opacity 0.4s ease, transform 0.4s ease; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.star-tooltip {
  position: fixed; z-index: 50; pointer-events: none;
  background: rgba(11, 24, 56, 0.92); backdrop-filter: blur(10px);
  border: 1px solid rgba(136,165,224,0.25); border-radius: 8px;
  padding: 12px 16px; max-width: 280px; color: var(--g-mist);
  font-size: 14px; line-height: 1.6; font-weight: 300;
  opacity: 0; transition: opacity 0.2s ease;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.star-tooltip.visible { opacity: 1; }
.star-tooltip .tt-name { font-size: 12px; opacity: 0.5; margin-bottom: 4px; }
.star-tooltip .tt-content { white-space: pre-wrap; word-break: break-word; }
.shooting-star {
  position: fixed; z-index: 150; pointer-events: none;
  width: 4px; height: 4px; border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 8px 3px rgba(200,221,245,0.8), 0 0 20px 6px rgba(136,165,224,0.4);
}
.shooting-star::after {
  content: ''; position: absolute; top: 0; right: 100%;
  width: 80px; height: 2px;
  background: linear-gradient(to left, rgba(200,221,245,0.8), transparent);
}
.sky {
  position: relative; overflow: hidden; min-height: 82vh;
}
.sky canvas { display: block; width: 100% !important; height: 100% !important; cursor: grab; }
.sky canvas:active { cursor: grabbing; }
.sky-hint {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  color: rgba(200,221,245,0.35); font-size: 12px; letter-spacing: 1px;
  pointer-events: none; z-index: 2;
}
.galaxy-vortex, .nebula-layer, .dust-layer { display: none; }
.star { display: none; }
.modal-backdrop {
  display: none; position: fixed; inset: 0; background: rgba(2, 8, 24, 0.8);
  backdrop-filter: blur(4px);
  align-items: center; justify-content: center; z-index: 100; padding: 20px;
}
.modal-backdrop.open { display: flex; }
.modal-backdrop .k-card { max-width: 480px; width: 100%; max-height: 86vh; overflow-y: auto; position: relative; }
.modal-close {
  position: absolute; top: 12px; right: 14px; cursor: pointer; font-size: 20px;
  color: var(--g-glow); opacity: 0.7; z-index: 10;
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  border-radius: 6px; transition: all 0.2s;
}
.modal-close:hover { opacity: 1; background: rgba(136,165,224,0.15); }
.msg-meta { font-size: 13px; opacity: 0.6; margin-bottom: 8px; }
.msg-content { font-size: 18px; white-space: pre-wrap; word-break: break-word; margin-bottom: 16px; line-height: 1.8; }
.like-list { list-style: none; padding: 0; margin: 12px 0 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
.like-chip { display: inline-flex; align-items: center; gap: 6px;
  background: rgba(136, 165, 224, 0.1);
  border: 1px solid rgba(136, 165, 224, 0.25); border-radius: 999px;
  padding: 4px 10px 4px 4px; font-size: 13px; }
.avatar-dot {
  width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center;
  justify-content: center; font-size: 11px; color: var(--g-cosmic);
  font-family: 'Inter', 'Noto Sans SC', sans-serif;
}
footer.galaxy-footer { text-align: center; padding: 24px; opacity: 0.4; font-size: 13px; letter-spacing: 2px; }
.msg-list-toggle {
  position: fixed; left: 20px; bottom: 28px; z-index: 40;
}
.compose-fab {
  position: fixed; right: 28px; bottom: 28px; z-index: 40;
  background: rgba(77, 65, 119, 0.6) !important;
  border-color: rgba(200, 221, 245, 0.4) !important;
  box-shadow: 0 4px 24px rgba(11, 24, 56, 0.5) !important;
}
.compose-fab:hover {
  background: rgba(58, 96, 160, 0.7) !important;
  box-shadow: 0 0 24px rgba(136, 165, 224, 0.4) !important;
}
.msg-list-panel {
  position: fixed; left: 0; top: 0; bottom: 0; width: 320px; z-index: 90;
  background: rgba(11, 24, 56, 0.92); backdrop-filter: blur(16px);
  border-right: 1px solid rgba(136,165,224,0.15);
  transform: translateX(-100%); transition: transform 0.3s ease;
  display: flex; flex-direction: column;
}
.msg-list-panel.open { transform: translateX(0); }
.msg-list-header {
  padding: 20px; border-bottom: 1px solid rgba(136,165,224,0.1);
  display: flex; justify-content: space-between; align-items: center;
}
.msg-list-header h3 { margin: 0; font-size: 16px; font-weight: 300; letter-spacing: 2px; }
.msg-list-body { flex: 1; overflow-y: auto; padding: 12px; }
.msg-list-item {
  padding: 12px; margin-bottom: 8px; border-radius: 8px;
  background: rgba(136,165,224,0.06); border: 1px solid rgba(136,165,224,0.1);
  cursor: pointer; transition: background 0.2s;
}
.msg-list-item:hover { background: rgba(136,165,224,0.12); }
.msg-list-item .mli-name { font-size: 12px; opacity: 0.5; margin-bottom: 4px; }
.msg-list-item .mli-content { font-size: 14px; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.msg-list-item .mli-time { font-size: 11px; opacity: 0.35; margin-top: 4px; }
.archive-notice {
  position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
  background: rgba(11, 24, 56, 0.8); backdrop-filter: blur(8px);
  border: 1px solid rgba(136,165,224,0.2); border-radius: 999px;
  padding: 6px 16px; font-size: 12px; color: rgba(200,221,245,0.5);
  letter-spacing: 1px; z-index: 30; pointer-events: none;
}
</style>
</head>
<body class="galaxy-page">

<div class="loading-overlay" id="loading-overlay" onclick="this.classList.add('fade-out');var s=this;setTimeout(function(){s.style.display='none'},900)">
  <div class="loading-star"></div>
  <div class="loading-text">星河正在苏醒…</div>
</div>
<script>
setTimeout(function(){
  var lo=document.getElementById('loading-overlay');
  if(lo&&!lo.classList.contains('fade-out')){
    lo.classList.add('fade-out');
    setTimeout(function(){lo.style.display='none'},900);
  }
},4000);
</script>

<div class="toast" id="toast"></div>
<div class="star-tooltip" id="star-tooltip"><div class="tt-name"></div><div class="tt-content"></div></div>

<div class="topbar">
  <div class="topbar-left">
    <button class="k-btn" onclick="exportMessages()">导出留言</button>
  </div>
  <div class="topbar-center">
    <h1 id="galaxy-title">关关的银河系</h1>
    <p class="topbar-subtitle">我们都是星球都会转，重逢是必然，离开是偶然。</p>
  </div>
  <div class="topbar-right">
    <span class="k-badge">19 颗星</span>
    <button class="k-btn blue" onclick="copyLink()">复制分享链接</button>
  </div>
</div>

<div class="sky" id="sky">
  <div class="galaxy-vortex"></div>
  <div class="nebula-layer nebula-1"></div>
  <div class="nebula-layer nebula-2"></div>
  <div class="nebula-layer nebula-3"></div>
  <div class="dust-layer dust-small"></div>
  <div class="dust-layer dust-big"></div>
  <div class="sky-hint">滚轮缩放 · 拖拽旋转 · 悬停星星查看寄语 · 点击星星查看详情</div>
</div>

<button class="k-btn msg-list-toggle" onclick="toggleMsgList()">📋 寄语列表</button>

<div class="msg-list-panel" id="msg-list-panel">
  <div class="msg-list-header">
    <h3>全部寄语</h3>
    <span class="modal-close" onclick="toggleMsgList()">✕</span>
  </div>
  <div class="msg-list-body" id="msg-list-body"></div>
</div>

<div class="modal-backdrop" id="star-modal" onclick="if(event.target===this)closeModal('star-modal')">
  <div class="k-card" id="star-modal-body"></div>
</div>

<script>
// 银河系独立静态版交互：只读展示 + 寄语列表 + 导出
(function () {
  "use strict";

  var MESSAGES = {};
  try {
    var raw = document.getElementById("messages-data");
    if (raw) MESSAGES = JSON.parse(raw.textContent || "{}");
  } catch (e) {
    MESSAGES = {};
  }

  window.__MESSAGES_RAW__ = MESSAGES;

  function openModal(id) {
    var el = document.getElementById(id);
    if (el) el.classList.add("open");
  }
  window.closeModal = function (id) {
    var el = document.getElementById(id);
    if (el) el.classList.remove("open");
  };

  function el(tag, opts) {
    var node = document.createElement(tag);
    opts = opts || {};
    if (opts.text !== undefined) node.textContent = opts.text;
    if (opts.className) node.className = opts.className;
    if (opts.html !== undefined) node.innerHTML = opts.html;
    return node;
  }

  function avatarColor(name) {
    var palette = ["#ffd166", "#a8d8ff", "#ffc2e2", "#c9ffe0", "#f2f2ff"];
    var s = 0;
    for (var i = 0; i < (name || "").length; i++) s += name.charCodeAt(i);
    return palette[s % palette.length];
  }

  function renderStarModal(id) {
    var data = MESSAGES[id];
    var body = document.getElementById("star-modal-body");
    if (!body) return;
    body.innerHTML = "";
    if (!data) return;

    body.appendChild(el("span", { className: "modal-close", text: "✕" })).onclick = function () {
      window.closeModal("star-modal");
    };
    var meta = el("div", { className: "msg-meta" });
    meta.appendChild(el("b", { text: data.sign_name || "匿名" }));
    meta.appendChild(document.createTextNode(" · " + (data.created_at || "")));
    if (data.visibility === "owner") {
      meta.appendChild(document.createTextNode(" · "));
      meta.appendChild(el("span", { className: "k-badge", text: "仅主人可见" }));
    }
    body.appendChild(meta);
    body.appendChild(el("div", { className: "msg-content", text: data.content || "" }));

    if ((data.likers || []).length > 0) {
      body.appendChild(el("div", { className: "msg-meta", text: "❤️ " + (data.like_count || data.likers.length) + " 个赞" }));
      var list = el("ul", { className: "like-list" });
      (data.likers || []).forEach(function (l) {
        var chip = el("li", { className: "like-chip" });
        var dot = el("span", { className: "avatar-dot", text: (l.user_name || "友").slice(0, 1) });
        dot.style.background = avatarColor(l.user_name || "友");
        chip.appendChild(dot);
        chip.appendChild(document.createTextNode(l.user_name || "神秘校友"));
        list.appendChild(chip);
      });
      body.appendChild(list);
    }
  }

  window.openStarModal = function (id) {
    renderStarModal(id);
    openModal("star-modal");
  };

  window.copyLink = function () {
    var url = window.location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(function () {
        alert("链接已复制～可以分享给朋友看寄语星空");
      }, function () {
        window.prompt("复制这个链接分享给朋友：", url);
      });
    } else {
      window.prompt("复制这个链接分享给朋友：", url);
    }
  };
})();

function escapeHtml(s) {
  var d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function showToast(msg, duration) {
  var t = document.getElementById("toast");
  if (!t) return;
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function () { t.classList.remove("show"); }, duration || 3000);
}

function exportMessages() {
  var data = window.__MESSAGES_RAW__ || {};
  var lines = [];
  var title = document.getElementById("galaxy-title");
  lines.push((title ? title.textContent : "关关的银河系") + " - 留言导出");
  lines.push("导出时间：" + new Date().toLocaleString());
  lines.push("---");
  Object.keys(data).forEach(function (k) {
    var m = data[k];
    lines.push("");
    lines.push("署名：" + (m.sign_name || "匿名"));
    lines.push("时间：" + (m.created_at || ""));
    lines.push("可见性：" + (m.visibility === "owner" ? "仅主人可见" : "所有人可见"));
    lines.push(m.content || "");
    if (m.likers && m.likers.length) {
      lines.push("❤️ " + m.likers.map(function (l) { return l.user_name; }).join(", "));
    }
    lines.push("---");
  });
  var blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (title ? title.textContent : "galaxy") + "-messages.txt";
  a.click();
  showToast("导出成功 📤", 2000);
}

function toggleMsgList() {
  var panel = document.getElementById("msg-list-panel");
  if (!panel) return;
  panel.classList.toggle("open");
  if (panel.classList.contains("open")) renderMsgList();
}

function renderMsgList() {
  var body = document.getElementById("msg-list-body");
  if (!body) return;
  var data = window.__MESSAGES_RAW__ || {};
  var keys = Object.keys(data);
  if (!keys.length) {
    body.innerHTML = "<div style='text-align:center;opacity:0.4;padding:40px'>还没有寄语</div>";
    return;
  }
  // 按时间倒序
  keys.sort(function (a, b) {
    return (data[b].created_at || "").localeCompare(data[a].created_at || "");
  });
  body.innerHTML = "";
  keys.forEach(function (k) {
    var m = data[k];
    var item = document.createElement("div");
    item.className = "msg-list-item";
    item.onclick = function () { window.openStarModal(m.id); };
    item.innerHTML =
      '<div class="mli-name">' + escapeHtml(m.sign_name || "匿名") + "</div>" +
      '<div class="mli-content">' + escapeHtml(m.content || "") + "</div>" +
      '<div class="mli-time">' + (m.created_at || "") + "</div>";
    body.appendChild(item);
  });
}

</script>

  var bgType = new Float32Array(BG_COUNT);
  for (var ti = 0; ti < BG_COUNT; ti++) {
    bgType[ti] = Math.random() < 0.2 ? 1.0 : 0.0; // 20% hollow
  }
  bgGeom.setAttribute('starType', new THREE.BufferAttribute(bgType, 1));

  var bgMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uTexSolid: { value: starTexSolid },
      uTexHollow: { value: starTexHollow },
    },
    vertexShader: [
      "attribute float size;",
      "attribute float phase;",
      "attribute vec3 color;",
      "attribute float flicker;",
      "attribute float starType;",
      "varying vec3 vColor;",
      "varying float vAlpha;",
      "varying float vType;",
      "uniform float uTime;",
      "void main() {",
      "  vColor = color;",
      "  vType = starType;",
      "  float base = 0.65 + 0.35 * abs(sin(uTime * 1.2 + phase));",
      "  if (flicker > 0.5) {",
      "    float f = abs(sin(uTime * (3.0 + flicker * 1.5) + phase * 3.0));",
      "    base = mix(0.15, 1.3, pow(f, 1.8 + flicker * 0.5));",
      "  }",
      "  if (starType > 0.5) base *= 0.7;",
      "  vAlpha = base;",
      "  vec4 mv = modelViewMatrix * vec4(position, 1.0);",
      "  float s = size;",
      "  if (starType > 0.5) s *= 1.4;",
      "  gl_PointSize = s * (300.0 / -mv.z);",
      "  gl_Position = projectionMatrix * mv;",
      "}",
    ].join("\n"),
    fragmentShader: [
      "varying vec3 vColor;",
      "varying float vAlpha;",
      "varying float vType;",
      "uniform sampler2D uTexSolid;",
      "uniform sampler2D uTexHollow;",
      "void main() {",
      "  vec4 texS = texture2D(uTexSolid, gl_PointCoord);",
      "  vec4 texH = texture2D(uTexHollow, gl_PointCoord);",
      "  vec4 tex = mix(texS, texH, step(0.5, vType));",
      "  gl_FragColor = vec4(vColor, tex.a * vAlpha);",
      "}",
    ].join("\n"),
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

  var bgStars = new THREE.Points(bgGeom, bgMat);
  scene.add(bgStars);

  // ── Extra shimmer layer (close, bright, fast twinkle) ──
  var SH_COUNT = 4000;
  var shPositions = new Float32Array(SH_COUNT * 3);
  var shSizes = new Float32Array(SH_COUNT);
  var shColors = new Float32Array(SH_COUNT * 3);
  var shPhases = new Float32Array(SH_COUNT);
  var shimmerPalette = [
    [1, 1, 1], [0.92, 0.95, 1], [0.85, 0.90, 1],
    [0.95, 0.88, 0.96], [0.80, 0.85, 0.98], [1, 0.97, 0.92],
  ];
  for (var si = 0; si < SH_COUNT; si++) {
    var sr = 100 + Math.random() * 800;
    var stheta = Math.random() * Math.PI * 2;
    var sphi = Math.acos(2 * Math.random() - 1);
    shPositions[si * 3] = sr * Math.sin(sphi) * Math.cos(stheta);
    shPositions[si * 3 + 1] = sr * Math.sin(sphi) * Math.sin(stheta);
    shPositions[si * 3 + 2] = sr * Math.cos(sphi);
    shSizes[si] = 2.0 + Math.random() * 4.0;
    shPhases[si] = Math.random() * Math.PI * 2;
    var sc = shimmerPalette[Math.floor(Math.random() * shimmerPalette.length)];
    shColors[si * 3] = sc[0]; shColors[si * 3 + 1] = sc[1]; shColors[si * 3 + 2] = sc[2];
  }
  var shGeom = new THREE.BufferGeometry();
  shGeom.setAttribute('position', new THREE.BufferAttribute(shPositions, 3));
  shGeom.setAttribute('size', new THREE.BufferAttribute(shSizes, 1));
  shGeom.setAttribute('color', new THREE.BufferAttribute(shColors, 3));
  shGeom.setAttribute('phase', new THREE.BufferAttribute(shPhases, 1));
  var shMat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 }, uTexture: { value: starTexSolid } },
    vertexShader: [
      'attribute float size; attribute float phase; attribute vec3 color;',
      'varying vec3 vColor; varying float vAlpha; uniform float uTime;',
      'void main() {',
      '  vColor = color;',
      '  float twinkle = pow(abs(sin(uTime * 3.5 + phase)), 2.0);',
      '  vAlpha = 0.25 + 0.75 * twinkle;',
      '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
      '  gl_PointSize = size * (300.0 / -mv.z);',
      '  gl_Position = projectionMatrix * mv;',
      '}',
    ].join('\n'),
    fragmentShader: [
      'varying vec3 vColor; varying float vAlpha; uniform sampler2D uTexture;',
      'void main() {',
      '  vec4 tex = texture2D(uTexture, gl_PointCoord);',
      '  gl_FragColor = vec4(vColor, tex.a * vAlpha);',
      '}',
    ].join('\n'),
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  var shimmerStars = new THREE.Points(shGeom, shMat);
  scene.add(shimmerStars);

  // ── Milky Way band (dense cluster of colored particles) ──
  var MW_COUNT = 5000;
  var mwPositions = new Float32Array(MW_COUNT * 3);
  var mwSizes = new Float32Array(MW_COUNT);
  var mwColors = new Float32Array(MW_COUNT * 3);
  var mwPhases = new Float32Array(MW_COUNT);

  var mwPalette = [
    [0.80, 0.70, 0.85],  // soft lavender-pink
    [0.75, 0.65, 0.82],  // plum mist
    [0.60, 0.55, 0.78],  // twilight plum
    [0.53, 0.65, 0.88],  // milky glow
    [0.85, 0.80, 0.90],  // warm light
    [0.78, 0.72, 0.65],  // warm amber hint
    [0.90, 0.85, 0.92],  // bright core
    [0.65, 0.60, 0.80],  // deep blue-purple
  ];

  for (var j = 0; j < MW_COUNT; j++) {
    // Band along a tilted plane with gaussian spread
    var bx = (Math.random() - 0.5) * 2400;
    var by = (Math.random() - 0.5) * 180 * (1 + 0.5 * Math.exp(-bx * bx / 400000));
    var bz = (Math.random() - 0.5) * 600;
    // Tilt the band
    var tilt = -0.3;
    var ry = by * Math.cos(tilt) - bz * Math.sin(tilt);
    var rz = by * Math.sin(tilt) + bz * Math.cos(tilt);
    mwPositions[j * 3] = bx;
    mwPositions[j * 3 + 1] = ry;
    mwPositions[j * 3 + 2] = rz;
    mwSizes[j] = 3 + Math.random() * 10;
    mwPhases[j] = Math.random() * Math.PI * 2;
    var mc = mwPalette[Math.floor(Math.random() * mwPalette.length)];
    mwColors[j * 3] = mc[0];
    mwColors[j * 3 + 1] = mc[1];
    mwColors[j * 3 + 2] = mc[2];
  }

  var mwGeom = new THREE.BufferGeometry();
  mwGeom.setAttribute("position", new THREE.BufferAttribute(mwPositions, 3));
  mwGeom.setAttribute("size", new THREE.BufferAttribute(mwSizes, 1));
  mwGeom.setAttribute("color", new THREE.BufferAttribute(mwColors, 3));
  mwGeom.setAttribute("phase", new THREE.BufferAttribute(mwPhases, 1));

  var mwTex = createGlowTexture(128, "rgba(255,255,255,0.6)", "rgba(180,160,200,0.15)");
  var mwMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uTexture: { value: mwTex },
    },
    vertexShader: [
      "attribute float size;",
      "attribute float phase;",
      "attribute vec3 color;",
      "varying vec3 vColor;",
      "varying float vAlpha;",
      "uniform float uTime;",
      "void main() {",
      "  vColor = color;",
      "  float twinkle = 0.3 + 0.7 * abs(sin(uTime * 0.3 + phase));",
      "  vAlpha = twinkle * 0.65;",
      "  vec4 mv = modelViewMatrix * vec4(position, 1.0);",
      "  gl_PointSize = size * (300.0 / -mv.z);",
      "  gl_Position = projectionMatrix * mv;",
      "}",
    ].join("\n"),
    fragmentShader: [
      "varying vec3 vColor;",
      "varying float vAlpha;",
      "uniform sampler2D uTexture;",
      "void main() {",
      "  vec4 tex = texture2D(uTexture, gl_PointCoord);",
      "  gl_FragColor = vec4(vColor, tex.a * vAlpha);",
      "}",
    ].join("\n"),
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

  var mwStars = new THREE.Points(mwGeom, mwMat);
  scene.add(mwStars);

  // ── Nebula filaments (wispy cloud trails) ──
  function createNebulaFilament(count, spreadX, spreadY, spreadZ, offsetX, offsetY, offsetZ, tilt, color, opacity) {
    var positions = new Float32Array(count * 3);
    var sizes = new Float32Array(count);
    var phases = new Float32Array(count);
    for (var ni = 0; ni < count; ni++) {
      var nx = (Math.random() - 0.5) * spreadX;
      var ny = (Math.random() - 0.5) * spreadY * (0.3 + 0.7 * Math.exp(-nx*nx/(spreadX*spreadX*0.15)));
      var nz = (Math.random() - 0.5) * spreadZ;
      positions[ni * 3] = nx + offsetX;
      positions[ni * 3 + 1] = ny * Math.cos(tilt) - nz * Math.sin(tilt) + offsetY;
      positions[ni * 3 + 2] = ny * Math.sin(tilt) + nz * Math.cos(tilt) + offsetZ;
      sizes[ni] = 15 + Math.random() * 40;
      phases[ni] = Math.random() * Math.PI * 2;
    }
    var nGeom = new THREE.BufferGeometry();
    nGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    nGeom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    nGeom.setAttribute('phase', new THREE.BufferAttribute(phases, 1));
    var nTex = createGlowTexture(256, 'rgba(255,255,255,0.35)', 'rgba(255,255,255,0.05)');
    var nMat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uTexture: { value: nTex }, uColor: { value: new THREE.Color(color) }, uOpacity: { value: opacity } },
      vertexShader: [
        'attribute float size; attribute float phase;',
        'varying float vAlpha; uniform float uTime;',
        'void main() {',
        '  float drift = 0.6 + 0.4 * sin(uTime * 0.15 + phase);',
        '  vAlpha = drift;',
        '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
        '  gl_PointSize = size * (300.0 / -mv.z);',
        '  gl_Position = projectionMatrix * mv;',
        '}',
      ].join('\n'),
      fragmentShader: [
        'varying float vAlpha; uniform sampler2D uTexture; uniform vec3 uColor; uniform float uOpacity;',
        'void main() {',
        '  vec4 tex = texture2D(uTexture, gl_PointCoord);',
        '  gl_FragColor = vec4(uColor, tex.a * vAlpha * uOpacity);',
        '}',
      ].join('\n'),
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    });
    return { points: new THREE.Points(nGeom, nMat), mat: nMat };
  }
  // Multiple wispy trails at different angles
  var nebulae = [
    createNebulaFilament(1200, 1400, 200, 400, 0, 50, 0, -0.2, '#8a6fba', 0.55),
    createNebulaFilament(900, 1100, 160, 350, -200, -80, 100, 0.4, '#5a80b8', 0.50),
    createNebulaFilament(700, 900, 140, 300, 150, 30, -150, -0.6, '#a088cc', 0.45),
    createNebulaFilament(600, 800, 130, 280, 100, -100, 200, 0.15, '#6a90c0', 0.48),
    createNebulaFilament(500, 1000, 180, 350, -100, 120, -80, 0.7, '#9478b0', 0.40),
  ];
  nebulae.forEach(function(n) { scene.add(n.points); });

  // ── Message stars (3D spheres with glow, clickable) ──
  var msgGroup = new THREE.Group();
  scene.add(msgGroup);
  var msgMeshes = []; // {mesh, id}

  var messagesDataEl = document.getElementById("messages-data");
  var messagesRaw = {};
  try { if (messagesDataEl) messagesRaw = JSON.parse(messagesDataEl.textContent || "{}"); } catch(e) {}

  // Each message star gets a unique random color
  var msgStarColorSets = [
    { core: 'rgba(200,221,245,1)', glow: 'rgba(136,165,224,0.4)', tint: 0xc8ddf5 },   // icy blue
    { core: 'rgba(180,160,220,1)', glow: 'rgba(130,110,190,0.4)', tint: 0xb4a0dc },   // lavender
    { core: 'rgba(220,180,230,1)', glow: 'rgba(190,140,200,0.4)', tint: 0xdcb4e6 },   // pink-purple
    { core: 'rgba(160,210,240,1)', glow: 'rgba(100,170,220,0.4)', tint: 0xa0d2f0 },   // sky blue
    { core: 'rgba(255,220,200,1)', glow: 'rgba(230,180,150,0.4)', tint: 0xffdcc8 },   // warm peach
    { core: 'rgba(200,240,220,1)', glow: 'rgba(140,210,180,0.4)', tint: 0xc8f0dc },   // mint
    { core: 'rgba(240,230,200,1)', glow: 'rgba(220,200,150,0.4)', tint: 0xf0e6c8 },   // warm gold
    { core: 'rgba(180,200,240,1)', glow: 'rgba(130,160,220,0.4)', tint: 0xb4c8f0 },   // periwinkle
    { core: 'rgba(230,200,220,1)', glow: 'rgba(200,160,190,0.4)', tint: 0xe6c8dc },   // rose
    { core: 'rgba(255,255,255,1)', glow: 'rgba(200,210,230,0.4)', tint: 0xffffff },   // pure white
  ];
  // Pre-create textures: solid + hollow for each color
  var msgTexSolid = msgStarColorSets.map(function(cs) {
    return { tex: createGlowTexture(256, cs.core, cs.glow), tint: cs.tint };
  });
  var msgTexHollow = msgStarColorSets.map(function(cs) {
    var c = document.createElement('canvas'); c.width = 256; c.height = 256;
    var ctx = c.getContext('2d'); var h = 128;
    var g = ctx.createRadialGradient(h, h, 0, h, h, h);
    g.addColorStop(0, 'rgba(255,255,255,0.0)');
    g.addColorStop(0.2, 'rgba(255,255,255,0.05)');
    g.addColorStop(0.35, cs.glow.replace('0.4)', '0.5)'));
    g.addColorStop(0.5, cs.glow);
    g.addColorStop(0.7, cs.glow.replace('0.4)', '0.15)'));
    g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.fillRect(0, 0, 256, 256);
    var t = new THREE.CanvasTexture(c); t.needsUpdate = true;
    return { tex: t, tint: cs.tint };
  });

  function seedRandom(id) {
    var x = Math.sin(id * 127.1 + 311.7) * 43758.5453;
    return function () {
      x = Math.sin(x * 12.9898 + 78.233) * 43758.5453;
      return x - Math.floor(x);
    };
  }

  Object.keys(messagesRaw).forEach(function (key) {
    var m = messagesRaw[key];
    var rnd = seedRandom(m.id);
    var r = 80 + rnd() * 320;
    var theta = rnd() * Math.PI * 2;
    var phi = 0.3 + rnd() * 2.5;
    var px = r * Math.sin(phi) * Math.cos(theta);
    var py = (rnd() - 0.5) * 200;
    var pz = r * Math.sin(phi) * Math.sin(theta);

    var size = 5 + rnd() * 10;

    // 40% hollow, 60% solid — each star gets unique color
    var isHollow = rnd() < 0.05;
    var colorIdx = Math.floor(rnd() * msgTexSolid.length);
    var chosenSet = isHollow ? msgTexHollow[colorIdx] : msgTexSolid[colorIdx];
    var spriteMat = new THREE.SpriteMaterial({
      map: chosenSet.tex,
      color: chosenSet.tint,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      opacity: 0.9,
    });
    var sprite = new THREE.Sprite(spriteMat);
    sprite.position.set(px, py, pz);
    sprite.scale.set(size * (isHollow ? 4.5 : 4), size * (isHollow ? 4.5 : 4), 1);
    msgGroup.add(sprite);

    // Core sphere for raycasting
    var geom = new THREE.SphereGeometry(size * 0.6, 12, 12);
    var mat = new THREE.MeshBasicMaterial({ color: 0xc8ddf5, transparent: true, opacity: 0.0 });
    var mesh = new THREE.Mesh(geom, mat);
    mesh.position.set(px, py, pz);
    msgGroup.add(mesh);

    msgMeshes.push({ mesh: mesh, sprite: sprite, id: m.id, baseSize: size, phase: rnd() * Math.PI * 2 });
  });

  // ── Click detection via raycaster ──
  var raycaster = new THREE.Raycaster();
  var mouse = new THREE.Vector2();

  renderer.domElement.addEventListener("pointerdown", function (e) {
    // Store start position for click vs drag detection
    renderer.domElement._clickStart = { x: e.clientX, y: e.clientY };
  });

  renderer.domElement.addEventListener("pointerup", function (e) {
    var start = renderer.domElement._clickStart;
    if (!start) return;
    var dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (Math.sqrt(dx * dx + dy * dy) > 5) return; // was a drag

    var rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    var meshes = msgMeshes.map(function (m) { return m.mesh; });
    var hits = raycaster.intersectObjects(meshes);
    if (hits.length > 0) {
      var hit = hits[0].object;
      for (var k = 0; k < msgMeshes.length; k++) {
        if (msgMeshes[k].mesh === hit) {
          if (typeof window.openStarModal === "function") {
            window.openStarModal(msgMeshes[k].id);
          }
          break;
        }
      }
    }
  });

  // ── Animate ──
  var clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    var t = clock.getElapsedTime();

    bgMat.uniforms.uTime.value = t;
    mwMat.uniforms.uTime.value = t;
    shMat.uniforms.uTime.value = t;

    // Update nebula uniforms
    nebulae.forEach(function(n) { n.mat.uniforms.uTime.value = t; });

    // Slowly rotate milky way
    mwStars.rotation.y = t * 0.01;
    // Slight rotation on shimmer layer for depth
    shimmerStars.rotation.y = t * -0.005;
    shimmerStars.rotation.x = Math.sin(t * 0.02) * 0.03;

    // Animate message star glow
    for (var i = 0; i < msgMeshes.length; i++) {
      var ms = msgMeshes[i];
      var glow = 0.6 + 0.4 * Math.sin(t * (0.8 + i * 0.1) + ms.phase);
      var s = ms.baseSize * 4 * (0.85 + 0.15 * glow);
      ms.sprite.scale.set(s, s, 1);
      ms.sprite.material.opacity = 0.5 + 0.5 * glow;
    }

    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  // ── Dismiss loading overlay ──
  setTimeout(function() {
    var lo = document.getElementById('loading-overlay');
    if (lo) { lo.classList.add('fade-out'); setTimeout(function() { lo.style.display = 'none'; }, 900); }
  }, 800);

  // ── Hover tooltip for message stars ──
  var tooltip = document.getElementById('star-tooltip');
  var hoveredStar = null;
  renderer.domElement.addEventListener('pointermove', function(e) {
    var rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    var meshes = msgMeshes.map(function(m) { return m.mesh; });
    var hits = raycaster.intersectObjects(meshes);
    if (hits.length > 0) {
      var hit = hits[0].object;
      for (var k = 0; k < msgMeshes.length; k++) {
        if (msgMeshes[k].mesh === hit) {
          var mid = msgMeshes[k].id;
          if (hoveredStar !== mid && tooltip && messagesRaw[mid]) {
            hoveredStar = mid;
            var m = messagesRaw[mid];
            tooltip.querySelector('.tt-name').textContent = m.sign_name || '\u533f\u540d';
            tooltip.querySelector('.tt-content').textContent = m.content || '';
            tooltip.classList.add('visible');
          }
          if (tooltip) {
            tooltip.style.left = Math.min(e.clientX + 16, window.innerWidth - 300) + 'px';
            tooltip.style.top = (e.clientY + 16) + 'px';
          }
          renderer.domElement.style.cursor = 'pointer';
          return;
        }
      }
    }
    if (hoveredStar !== null) {
      hoveredStar = null;
      if (tooltip) tooltip.classList.remove('visible');
      renderer.domElement.style.cursor = 'grab';
    }
  });

  // ── Resize ──
  window.addEventListener("resize", function () {
    w = container.clientWidth;
    h = container.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });

  // ── Mobile performance: reduce particles ──
  var isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);
  if (isMobile) {
    // Reduce bg stars
    var visCount = Math.floor(BG_COUNT * 0.4);
    bgGeom.setDrawRange(0, visCount);
    // Reduce shimmer
    shGeom.setDrawRange(0, Math.floor(SH_COUNT * 0.3));
    // Reduce milky way
    mwGeom.setDrawRange(0, Math.floor(MW_COUNT * 0.3));
    // Lower pixel ratio
    renderer.setPixelRatio(1);
  }

  // Expose for external use
  window.__galaxy3d = { scene: scene, camera: camera, renderer: renderer, controls: controls };
  } catch(err) {
    console.error('galaxy-3d INIT ERROR:', err);
    var sky = document.getElementById('sky');
    if (sky) sky.innerHTML = '<div style="color:#ff6b6b;padding:40px;text-align:center;font-size:14px">3D Error: ' + err.message + '</div>';
  }
})();

</script>

</body>
